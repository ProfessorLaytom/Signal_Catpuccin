name: Build Catppuccin Signal

on:
  schedule:
    - cron: '0 4 * * 0' # Automatically checks and builds every Sunday at 4:00 AM UTC
  workflow_dispatch:      # Allows you to trigger a build manually anytime

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Signal Upstream
        uses: actions/checkout@v4
        with:
          repository: signalapp/Signal-Android
          ref: main
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Inject Catppuccin Mocha Mauve Colors
        run: |
          FILE="core/ui/src/main/res/values/material3_colors_dark.xml"
          
          # Mauve Primary Accent
          sed -i 's/<color name="signal_dark_colorPrimary">.*<\/color>/<color name="signal_dark_colorPrimary">#CBA6F7<\/color>/' $FILE
          sed -i 's/<color name="signal_dark_colorOnPrimary">.*<\/color>/<color name="signal_dark_colorOnPrimary">#11111B<\/color>/' $FILE
          
          # Mocha Base & Mantle Backgrounds
          sed -i 's/<color name="signal_dark_colorBackground">.*<\/color>/<color name="signal_dark_colorBackground">#1E1E2E<\/color>/' $FILE
          sed -i 's/<color name="signal_dark_colorSurface">.*<\/color>/<color name="signal_dark_colorSurface">#181825<\/color>/' $FILE
          sed -i 's/<color name="signal_dark_colorSurface1">.*<\/color>/<color name="signal_dark_colorSurface1">#181825<\/color>/' $FILE
          sed -i 's/<color name="signal_dark_colorSurfaceVariant">.*<\/color>/<color name="signal_dark_colorSurfaceVariant">#313244<\/color>/' $FILE
          
          # Mocha Text & Subtext
          sed -i 's/<color name="signal_dark_colorOnBackground">.*<\/color>/<color name="signal_dark_colorOnBackground">#CDD6F4<\/color>/' $FILE
          sed -i 's/<color name="signal_dark_colorOnSurface">.*<\/color>/<color name="signal_dark_colorOnSurface">#CDD6F4<\/color>/' $FILE
          sed -i 's/<color name="signal_dark_colorOnSurfaceVariant">.*<\/color>/<color name="signal_dark_colorOnSurfaceVariant">#A6ADC8<\/color>/' $FILE

      - name: Build Release APK
        run: ./gradlew assemblePlayRelease --no-daemon

      - name: Sign APK with Personal Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          UNSIGNED_APK=$(find app/build/outputs/apk/play/release -name "*.apk" | head -n 1)
          
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks keystore.jks \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEYSTORE_PASSWORD" \
            --out Signal-Catppuccin-Mauve.apk \
            "$UNSIGNED_APK"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: Signal Catppuccin Mauve (Build ${{ github.run_number }})
          files: Signal-Catppuccin-Mauve.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
